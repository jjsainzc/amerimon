@if (open) {
  <div class="confirmacion-overlay" (click)="onBackdropClick($event)">
    <section class="confirmacion-dialogo" role="alertdialog" aria-modal="true" aria-labelledby="confirmacion-titulo" aria-describedby="confirmacion-mensaje" (click)="$event.stopPropagation()">
      <div class="confirmacion-icono" aria-hidden="true">!</div>
      <div class="confirmacion-contenido">
        <h2 id="confirmacion-titulo">{{ title }}</h2>
        <p id="confirmacion-mensaje">{{ message }}</p>
      </div>
      <div class="confirmacion-acciones">
        <button type="button" class="confirmacion-cancelar" (click)="cancelled.emit()" [disabled]="busy">Cancelar</button>
        <button type="button" class="confirmacion-confirmar" (click)="confirmed.emit()" [disabled]="busy" [attr.aria-busy]="busy">
          @if (busy) {
            <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
          } @else if (showDeleteIcon) { <i class="fa-solid fa-trash-can" aria-hidden="true"></i> }
          {{ confirmLabel }}
        </button>
      </div>
    </section>
  </div>
}
