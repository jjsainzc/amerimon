<span class="pf">
  <input [id]="inputId() || null" [type]="visible() ? 'text' : 'password'" [value]="valor()" [attr.autocomplete]="autocomplete()"
         [attr.placeholder]="placeholder() || null" [required]="required()" [attr.minlength]="minlength()"
         [disabled]="deshabilitado()" (input)="alEscribir($any($event.target).value)" (blur)="onTouched()" />
  <button type="button" class="pf-ojo" [attr.aria-label]="(visible() ? 'OCULTAR_CONTRASENA' : 'MOSTRAR_CONTRASENA') | translate"
          [attr.aria-pressed]="visible()" [disabled]="deshabilitado()" (click)="toggleVisibility()">
    @if (visible()) {
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 5C7 5 3 9 2 12c1 3 5 7 10 7s9-4 10-7c-1-3-5-7-10-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg>
    } @else {
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 5C7 5 3 9 2 12c1 3 5 7 10 7s9-4 10-7c-1-3-5-7-10-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/><path stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M3.5 3.5l17 17"/></svg>
    }
  </button>
</span>
