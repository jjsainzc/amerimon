@if (open) {
  <div class="markdown-viewer-overlay" (click)="close()">
    <section class="markdown-viewer-dialog" role="dialog" aria-modal="true" aria-labelledby="markdown-viewer-title" (click)="$event.stopPropagation()">
      <header class="markdown-viewer-header">
        <div>
          <p class="markdown-viewer-eyebrow">{{ eyebrow }}</p>
          <h2 id="markdown-viewer-title">{{ title }}</h2>
        </div>
        <button type="button" class="markdown-viewer-close" aria-label="Cerrar documento" (click)="close()">&times;</button>
      </header>
      <p class="markdown-viewer-diagram-note" role="note">
        En pantallas pequeñas, los diagramas pueden verse reducidos. Amplía la ventana o desplázate horizontalmente para distinguirlos mejor.
      </p>
      @if (loading()) {
        <p class="markdown-viewer-state" role="status">Cargando documento…</p>
      } @else if (error()) {
        <div class="markdown-viewer-state" role="alert">
          <p>{{ error() }}</p>
          <button type="button" class="markdown-viewer-retry" (click)="loadMarkdown()">Reintentar</button>
        </div>
      } @else {
        <article class="markdown-viewer-content" [innerHTML]="html()"></article>
      }
    </section>
  </div>
}
