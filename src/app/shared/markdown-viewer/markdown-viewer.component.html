@if (open) {
  <div class="markdown-viewer-overlay" [class.markdown-viewer-page]="presentation === 'page'">
    <section class="markdown-viewer-dialog" role="dialog" aria-modal="true" aria-labelledby="markdown-viewer-title">
      <header class="markdown-viewer-header">
        <div>
          <p class="markdown-viewer-eyebrow">{{ eyebrow }}</p>
          <h2 id="markdown-viewer-title">{{ title | translate }}</h2>
        </div>
        <button type="button" class="markdown-viewer-close" [attr.aria-label]="'CERRAR' | translate" (click)="close()">&times;</button>
      </header>
      <app-dismissible-notice class="markdown-viewer-diagram-notice" noticeKey="notice.manual.small-screen">
        <p class="markdown-viewer-diagram-note" role="note">
          {{ 'NOTA_DIAGRAMAS_PANTALLA_PEQUENA' | translate }}
        </p>
      </app-dismissible-notice>
      @if (loading()) {
        <p class="markdown-viewer-state" role="status">{{ 'CARGANDO_DOCUMENTO' | translate }}</p>
      } @else if (error()) {
        <div class="markdown-viewer-state" role="alert">
          <p>{{ error() | translate:{titulo: (title | translate)} }}</p>
          <button type="button" class="markdown-viewer-retry" (click)="loadMarkdown()">{{ 'REINTENTAR' | translate }}</button>
        </div>
      } @else {
        <article class="markdown-viewer-content" [innerHTML]="html()"></article>
      }
    </section>
  </div>
}
