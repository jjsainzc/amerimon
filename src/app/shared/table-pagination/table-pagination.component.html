@if (placement === 'top' && (showPageSize || showSearch)) {
  <div class="table-pagination-top" data-print-hide>
    @if (showSearch) {
      <label class="table-pagination-search">
        <span class="table-pagination-search-icon" aria-hidden="true">🔎</span>
        <span class="visually-hidden">{{ searchLabel }}</span>
        <input type="search" [value]="searchText" [placeholder]="searchPlaceholder"
          (input)="searchChange.emit($any($event.target).value)" />
      </label>
    }
    @if (summaryText) {
      <span class="table-pagination-count" aria-live="polite">{{ summaryText }}</span>
    }
    @if (showPageSize) {
      <div class="table-pagination-size">
        <label>Por página
          <select [value]="pageSize" (change)="pageSizeChange.emit($any($event.target).value)">
            @for (size of pageSizeOptions; track size) {
              <option [value]="size" [selected]="size === pageSize">{{ size }}</option>
            }
          </select>
        </label>
      </div>
    }
  </div>
}

@if (placement === 'bottom' && !hideNavigation) {
  <nav class="table-pagination-nav" data-print-hide aria-label="Paginación de resultados">
    <button type="button" class="btn-paginacion btn-paginacion-extremo" (click)="pageChange.emit(1)" [disabled]="currentPage <= 1" aria-label="Ir al inicio" title="Inicio">«</button>
    <button type="button" class="btn-paginacion" (click)="pageChange.emit(currentPage - 1)" [disabled]="currentPage <= 1">← Anterior</button>
    <span class="table-pagination-info">Página {{ currentPage }} de {{ totalPages }}</span>
    <button type="button" class="btn-paginacion" (click)="pageChange.emit(currentPage + 1)" [disabled]="currentPage >= totalPages">Siguiente →</button>
    <button type="button" class="btn-paginacion btn-paginacion-extremo" (click)="pageChange.emit(totalPages)" [disabled]="currentPage >= totalPages" aria-label="Ir al final" title="Final">»</button>
  </nav>
}
