<div class="password-generator-container">
  <div class="header-card">
    <h2>{{ 'PASSWORD_GENERATOR_TITLE' | translate }}</h2>
  </div>

  <div class="content-box">
    <form [formGroup]="genForm" (ngSubmit)="generate()">

      <!-- Campo de resultado y botón de copiar -->
      <div class="result-section">
        <input
          type="text"
          [value]="generatedPassword"
          readonly
          [attr.aria-label]="'PASSWORD_GENERATOR_RESULT' | translate"
          [placeholder]="'PASSWORD_GENERATOR_RESULT' | translate"
        />
        <button type="button" class="btn-action" (click)="copyToClipboard()">
          {{ (copied ? 'PASSWORD_GENERATOR_COPIED' : 'PASSWORD_GENERATOR_COPY') | translate }}
        </button>
        <button type="button" class="btn-action btn-refresh" (click)="generate()"
                [attr.aria-label]="'PASSWORD_GENERATOR_REGENERATE' | translate"
                [title]="'PASSWORD_GENERATOR_REGENERATE' | translate">
          ↻
        </button>
      </div>

      <!-- Mensaje de error si la validación falla -->
      <div *ngIf="errorMessage" class="error-msg">
        {{ errorMessage | translate }}
      </div>

      <!-- Controles de Configuración -->
      <div class="controls-grid">

        <!-- Longitud -->
        <div class="control-group">
          <label for="length">{{ 'PASSWORD_GENERATOR_LENGTH' | translate }}</label>
          <input
            id="length"
            type="number"
            formControlName="length"
            min="8"
            required
          />
        </div>

        <!-- Opciones de Criterios (m, M, n, e) -->
        <div class="checkboxes-group">
          <label class="checkbox-label">
            <input type="checkbox" formControlName="useLower" /> {{ 'PASSWORD_GENERATOR_LOWERCASE' | translate }}
          </label>
          <label class="checkbox-label">
            <input type="checkbox" formControlName="useUpper" /> {{ 'PASSWORD_GENERATOR_UPPERCASE' | translate }}
          </label>
          <label class="checkbox-label">
            <input type="checkbox" formControlName="useNumbers" /> {{ 'PASSWORD_GENERATOR_NUMBERS' | translate }}
          </label>
          <label class="checkbox-label">
            <input type="checkbox" formControlName="useSymbols" /> {{ 'PASSWORD_GENERATOR_SYMBOLS' | translate }}
          </label>
          <p class="options-note">{{ 'PASSWORD_GENERATOR_DEFAULT_OPTIONS' | translate }}</p>
        </div>

      </div>

      <!-- Botón principal de generación -->
      <button type="submit" class="btn-primary" [disabled]="genForm.invalid">{{ 'PASSWORD_GENERATOR_GENERATE' | translate }}</button>

      <!-- Información de Entropía -->
      <div class="entropy-info" *ngIf="generatedPassword">
        <span>{{ 'PASSWORD_GENERATOR_ENTROPY' | translate }} <strong>{{ entropy | number:'1.1-1' }} bits</strong></span>
      </div>

    </form>
  </div>
</div>
