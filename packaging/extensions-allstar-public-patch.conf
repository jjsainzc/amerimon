[allstar-public]

exten => s,1,Ringing
        same => n,NoOp(Connect from node: ${CALLERID(name)})
        same => n,Set(RESP=${CURL(https://register.allstarlink.org/cgi-bin/authwebphone.pl?${CALLERID(name)})})
        same => n,Set(NODENUM=${CALLERID(number)})
        same => n,GotoIf($["${RESP:0:1}" = "?"]?hangit)
        same => n,GotoIf($["${RESP:0:1}" = ""]?hangit)
        same => n,GotoIf($["${RESP:0:5}" != "OHYES"]?hangit)
        same => n,Set(CALLSIGN=${RESP:5})

        ; --- COMPROBACIÓN INICIAL: SI AMBAS LISTAS ESTÁN VACÍAS, CONECTA LIBREMENTE ---
        same => n,Set(WL_COUNT=$[${DB_KEYCOUNT(whitelist)} + 0])
        same => n,Set(BL_COUNT=$[${DB_KEYCOUNT(blacklist)} + 0])
        same => n,GotoIf($[$[${WL_COUNT} = 0] & $[${BL_COUNT} = 0]]?connect)

        ; --- VALIDACIÓN DE WHITELIST ---
        same => n,GotoIf($[${WL_COUNT} = 0]?blacklist)                         ; Si la whitelist está vacía, pasa a revisar la blacklist
        same => n,GotoIf(${DB_EXISTS(whitelist/${CALLSIGN})}?connect)            ; Si está en la whitelist, se conecta

        ; --- VALIDACIÓN DE BLACKLIST (Se ejecuta si la whitelist tiene elementos pero el nodo NO está en ella) ---
        same => n(blacklist),GotoIf($[${BL_COUNT} = 0]?hangit)                   ; Si la blacklist está vacía pero la whitelist no, y no hizo match -> cuelga
        same => n,GotoIf(${DB_EXISTS(blacklist/${CALLSIGN})}?blacked:notfound)   ; Si está en blacklist salta a colgar, si no, va a no encontrado

        ; --- ACCIÓN SI ESTÁ EN BLACKLIST ---
        same => n(blacked),NoOp(${CALLSIGN} is in blacklist, Hangup)
        same => n,Hangup

        ; --- ACCIÓN SI NO ESTÁ EN NINGUNA DE LAS DOS (Y al menos una lista tiene elementos) ---
        same => n(notfound),NoOp(${CALLSIGN} not in whitelist or blacklist, Hangup)
        same => n,Hangup

        ; --- CONEXIÓN EXITOSA ---
        same => n(connect),Wait(3)
        same => n,Playback(rpt/node,noanswer)
        same => n,Saydigits(${NODENUM})
        same => n,Set(CALLERID(name)=${CALLSIGN})
        same => n,Set(CALLERID(num)=0)
        same => n,Rpt(${NODENUM}|X)
        same => n,Hangup

        ; --- MANEJADOR DE ERRORES / RECHAZO ---
        same => n(hangit),Answer
        same => n,Wait(1)
        same => n,Hangup
