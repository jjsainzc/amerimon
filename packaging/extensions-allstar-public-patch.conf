[allstar-public]
exten => s,1,Ringing()
        same => n,NoOp(Connect from node: ${CALLERID(name)})
        same => n,Set(RESP=${CURL(https://register.allstarlink.org/cgi-bin/authwebphone.pl?${CALLERID(name)})})
        same => n,GotoIf($["${RESP:0:1}" = "?"]?hangit)
        same => n,GotoIf($["${RESP:0:1}" = ""]?hangit)
        same => n,GotoIf($["${RESP:0:5}" != "OHYES"]?hangit)
        same => n,Set(CALLSIGN=${RESP:5})
        same => n,Set(NODENUM=${CALLERID(num)})
        ; Conserva CALLSIGN completo; compara sin sufijos portátiles o de repetidor.
        same => n,Set(CALLSIGN_BASE=${CUT(CALLSIGN,-,1)})
        same => n,Set(CALLSIGN_BASE=${CUT(CALLSIGN_BASE,/,1)})
        same => n,Set(CALLSIGN_BASE=${TOUPPER(${CALLSIGN_BASE})})
        same => n,GotoIf($["${CALLSIGN_BASE}" = ""]?hangit)

        ; --- CONTROL POR NODO E INDICATIVO ---
        ; Sin coincidencia en estas listas, continúa con el filtro global.
        same => n,GotoIf(${DB_EXISTS(allowlist/${NODENUM}/${CALLSIGN_BASE})}?connect)
        same => n,GotoIf(${DB_EXISTS(denylist/${NODENUM}/${CALLSIGN_BASE})}?node_denied:check_callsign)
        same => n(node_denied),NoOp(${CALLSIGN} is in denylist/${NODENUM}, Hangup)
        same => n,Hangup

        ; --- CONTROL GLOBAL POR INDICATIVO ---
        ; Si ambas listas globales están vacías, permite el indicativo autenticado.
        same => n(check_callsign),Set(WL_COUNT=$[${DB_KEYCOUNT(whitelist)} + 0])
        same => n,Set(BL_COUNT=$[${DB_KEYCOUNT(blacklist)} + 0])
        same => n,GotoIf($[$[${WL_COUNT} = 0] & $[${BL_COUNT} = 0]]?connect)

        ; --- VALIDACIÓN DE WHITELIST ---
        same => n,GotoIf($[${WL_COUNT} = 0]?check_blacklist)                   ; Si la whitelist está vacía, salta directo a revisar la blacklist
        same => n,GotoIf(${DB_EXISTS(whitelist/${CALLSIGN_BASE})}?connect)            ; Si está en la whitelist, se conecta

        ; Si la whitelist tiene elementos pero NO hizo match, cae aquí (debe revisar blacklist)
        same => n,Goto(check_blacklist)

        ; --- VALIDACIÓN DE BLACKLIST ---
        same => n(check_blacklist),GotoIf($[${BL_COUNT} = 0]?notfound)          ; Si la blacklist está vacía, va a notfound (que cuelga por no estar en ninguna)
        same => n,GotoIf(${DB_EXISTS(blacklist/${CALLSIGN_BASE})}?blacked)          ; Si está en blacklist salta a bloquear

        ; --- ACCIÓN SI NO ESTÁ EN NINGUNA DE LAS DOS (Y al menos una lista tiene elementos) ---
        same => n(notfound),NoOp(${CALLSIGN} not in whitelist or blacklist, Hangup)
        same => n,Hangup

        ; --- ACCIÓN SI ESTÁ EN BLACKLIST ---
        same => n(blacked),NoOp(${CALLSIGN} is in blacklist, Hangup)
        same => n,Hangup

        ; --- CONEXIÓN EXITOSA ---
        same => n(connect),Set(CALLERID(name)=${CALLSIGN})
        same => n,Set(CALLERID(num)=0)
        same => n,Wait(3)
        same => n,Playback(rpt/connected-to&rpt/node,noanswer)
        same => n,SayDigits(${NODENUM})
        same => n,Rpt(${NODENUM},X)
        same => n,Hangup

        ; --- MANEJADOR DE ERRORES / RECHAZO ---
        same => n(hangit),Answer()
        same => n,Wait(1)
        same => n,Hangup
