[sip-phones]

  ; esta configuracion hace crash en algunos casos
  ; se recomienda usar la configuracion con canal Local en lugar de PJSIP directo

  ;exten => 1005,1,Dial(PJSIP/${EXTEN},60,rT)
  ;exten => ${NODE},1,Ringing
  ;exten => ${NODE},n,Answer(3000)
  ;exten => ${NODE},n,Set(NODENUM=${CALLERID(number)})
  ;exten => ${NODE},n,rpt(${EXTEN},Pv)
  ;exten => ${NODE},n,Hangup

  ; Utilizar un canal Local como intermediario,
  ; Asterisk aísla la negociación de PJSIP y permite que app_rpt
  ; reciba el flujo de audio de manera estándar sin colapsar el sistema.
  ; tampoco necesita de ningun manejo especial de PJSIP, ni variables adicionales

  exten => _X.,1,Ringing()
  exten => _X.,2,Answer(3000)
  exten => _X.,3,Set(__NODE=${EXTEN})
  exten => _X.,4,Dial(Local/${NODE}@rpt-internal,,,b(sip-bridge^addheader^1))
  exten => _X.,5,Hangup()
