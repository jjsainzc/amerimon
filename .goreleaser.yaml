version: 2

project_name: amerimon

before:
  hooks:
    - go mod tidy
    - npm ci
    - npm run build

builds:
  - id: amerimon
    main: ./cmd/amerimon
    binary: amerimon
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]

nfpms:
  - id: amerimon-deb
    package_name: amerimon
    formats:
      - deb
    maintainer: "Amerimon <support@amerinet-hamradio.net>"
    description: Amerimon web application with embedded Angular frontend and SQLite storage.
    license: Proprietary
    section: web
    priority: optional
    # curl: astdb; getent + NSS/Avahi: nombres .local; nc: audio EAGI.
    dependencies:
      - curl
      - libc-bin
      - libnss-mdns
      - avahi-daemon
      - netcat-openbsd | netcat-traditional | ncat
    contents:
      - src: packaging/amerimon.service
        dst: /lib/systemd/system/amerimon.service
      - src: packaging/amerimon.env
        dst: /etc/amerimon/amerimon.env
        type: config|noreplace
        file_info:
          mode: 0600
      - src: packaging/amerimon.yaml
        dst: /etc/amerimon/amerimon.yaml
        type: config|noreplace
      - dst: /var/lib/amerimon
        type: dir
        file_info:
          mode: 0750
      - src: packaging/astdb.sh
        dst: /usr/local/bin/astdb.sh
        file_info:
          mode: 0755
      - src: packaging/amerimon-astdb.service
        dst: /lib/systemd/system/amerimon-astdb.service
      - src: packaging/amerimon-astdb.timer
        dst: /lib/systemd/system/amerimon-astdb.timer
      - src: packaging/audio_eagi.sh
        dst: /usr/local/bin/audio_eagi.sh
        file_info:
          mode: 0755
      - src: packaging/listen-live-dialplan.awk
        dst: /usr/lib/amerimon/listen-live-dialplan.awk
      - src: packaging/merge-allstar-public.awk
        dst: /usr/lib/amerimon/merge-allstar-public.awk
      - src: packaging/extensions-allstar-public-patch.conf
        dst: /usr/share/amerimon/extensions-allstar-public-patch.conf
      - src: packaging/configure-pjsip.sh
        dst: /usr/lib/amerimon/configure-pjsip.sh
      - src: packaging/merge-pjsip-modules.awk
        dst: /usr/lib/amerimon/merge-pjsip-modules.awk
      - src: packaging/pjsip-modules-patch.conf
        dst: /usr/share/amerimon/pjsip-modules-patch.conf
      - src: packaging/pjsip-extensions-sip-phones-patch.conf
        dst: /usr/share/amerimon/pjsip-extensions-sip-phones-patch.conf
      - src: scripts/limpiar_canales_listen_live.sh
        dst: /usr/local/bin/limpiar_canales_listen_live.sh
        file_info:
          mode: 0755
      - src: packaging/apache-amerimon.conf.example
        dst: /usr/share/amerimon/apache-amerimon.conf.example
      - src: packaging/nginx-amerimon.conf.example
        dst: /usr/share/amerimon/nginx-amerimon.conf.example
      - src: packaging/configure-nginx.sh
        dst: /usr/lib/amerimon/configure-nginx.sh
        file_info:
          mode: 0755
      - src: packaging/amerimon-reset-password.sh
        dst: /usr/sbin/amerimon-reset-password
        file_info:
          mode: 0750
    scripts:
      postinstall: packaging/postinstall.sh
      preremove: packaging/preremove.sh
      postremove: packaging/postremove.sh

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
